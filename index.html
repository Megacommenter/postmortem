<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POST-MORTEM — a game about running a studio</title>
<meta name="description" content="Twenty-one decisions. Three numbers. You only get to see two of them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=JetBrains+Mono:wght@400;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root{
  --desk:#15181A;        /* the dark office */
  --desk-2:#1E2225;
  --paper:#D6D2C4;       /* manila */
  --paper-2:#C9C4B4;
  --ink:#14161A;
  --rule:#A29B8A;
  --stamp:#7E2A1E;       /* oxblood rubber stamp */
  --carbon:#3D4C5A;      /* carbon-copy blue */
  --good:#2A4636;        /* accounting green */
  --dim:#6E6A5C;
  --display:'Archivo Black',system-ui,sans-serif;
  --body:'Source Serif 4',Georgia,serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--desk);
  color:var(--ink);
  font-family:var(--body);
  font-size:17px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding:0 0 80px;
}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}

/* ---------- HUD ---------- */
.hud{
  position:sticky;top:0;z-index:50;
  background:var(--desk);
  border-bottom:1px solid #2E3438;
}
.hud-inner{max-width:720px;margin:0 auto;padding:10px 16px;display:flex;gap:0;align-items:stretch}
.slot{flex:1;padding:4px 12px;border-left:1px solid #2E3438}
.slot:first-child{border-left:0;padding-left:0}
.slot-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.16em;color:#7C8489;text-transform:uppercase}
.slot-val{font-family:var(--mono);font-weight:700;font-size:19px;color:#E4E0D2;letter-spacing:-.02em;line-height:1.3}
.slot-val.neg{color:#C2503C}
.bar{height:4px;background:#2E3438;margin-top:6px;position:relative;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:#8FA08C;transition:width .5s cubic-bezier(.2,.7,.3,1)}
.redact{
  height:26px;margin-top:2px;background:var(--ink);
  position:relative;overflow:hidden;
  box-shadow:inset 0 0 0 1px #2E3438;
}
.redact::after{
  content:'';position:absolute;inset:0;
  background:repeating-linear-gradient(115deg,#1B1E22 0 7px,#101316 7px 14px);
}
.redact.lift::after{animation:lift 1.1s cubic-bezier(.6,0,.2,1) forwards}
@keyframes lift{to{transform:translateX(102%)}}
.redact .hidden-val{
  font-family:var(--mono);font-weight:700;font-size:19px;color:#E4E0D2;
  display:flex;align-items:center;height:100%;padding-left:1px;
}

/* ---------- document card ---------- */
.eyebrow{
  display:flex;justify-content:space-between;align-items:baseline;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:#7C8489;padding:26px 0 10px;
}
.doc{
  background:var(--paper);
  padding:34px 30px 30px;
  position:relative;
  box-shadow:0 18px 40px -20px #000, 0 1px 0 rgba(255,255,255,.08);
  background-image:radial-gradient(#00000008 1px,transparent 1px);
  background-size:4px 4px;
}
.doc::before{
  content:'';position:absolute;top:0;left:0;right:0;height:5px;
  background:repeating-linear-gradient(90deg,var(--ink) 0 14px,transparent 14px 22px);
  opacity:.55;
}
h1.title{
  font-family:var(--display);font-size:clamp(26px,6.2vw,38px);
  line-height:.98;letter-spacing:-.02em;margin:0 0 6px;text-transform:uppercase;
}
.kicker{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--stamp);margin:0 0 18px;
}
.body p{margin:0 0 14px}
.body p:last-child{margin-bottom:0}
.body em{font-style:italic}
.rule{height:1px;background:var(--rule);margin:24px 0 18px;opacity:.7}

/* ---------- options ---------- */
.opts{display:flex;flex-direction:column;gap:10px}
button.opt{
  display:block;width:100%;text-align:left;cursor:pointer;
  font-family:var(--body);font-size:16.5px;color:var(--ink);
  background:var(--paper-2);border:1px solid var(--rule);
  padding:14px 16px;transition:background .13s,transform .13s,border-color .13s;
}
button.opt:hover:not(:disabled){background:#DCD8CA;border-color:var(--ink);transform:translateX(3px)}
button.opt:focus-visible{outline:3px solid var(--stamp);outline-offset:2px}
.opt-head{display:flex;gap:11px;align-items:baseline}
.opt-key{font-family:var(--mono);font-weight:700;font-size:12px;color:var(--stamp)}
.opt-text{flex:1}
.opt-costs{
  font-family:var(--mono);font-size:11.5px;letter-spacing:.04em;
  margin-top:9px;padding-left:23px;color:var(--dim);
  display:flex;gap:16px;flex-wrap:wrap;
}
.c-money.pos{color:var(--good)} .c-money.neg{color:var(--stamp)}
.c-hap.pos{color:var(--good)} .c-hap.neg{color:var(--stamp)}
.c-mor{color:var(--carbon)}
.c-hidden{color:#8A8474}
button.opt.locked{
  cursor:not-allowed;opacity:.62;background:transparent;
  border-style:dashed;
}
button.opt.locked .opt-text{text-decoration:line-through;text-decoration-thickness:1px}
.lock-note{
  font-family:var(--mono);font-size:11px;color:var(--stamp);
  margin-top:8px;padding-left:23px;text-transform:uppercase;letter-spacing:.08em;
}

/* ---------- interstitial / cold calc ---------- */
.stamp-box{
  border:2px solid var(--stamp);color:var(--stamp);
  font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  padding:7px 12px;display:inline-block;transform:rotate(-1.2deg);margin-bottom:20px;font-weight:700;
}
.calc{
  font-family:var(--mono);font-size:13px;background:#00000010;
  border-left:3px solid var(--carbon);padding:14px 16px;margin:0 0 20px;
}
.calc div{display:flex;justify-content:space-between;gap:12px;padding:2px 0}
.calc .tot{border-top:1px solid var(--rule);margin-top:7px;padding-top:7px;font-weight:700}
.mirror{
  font-style:italic;color:#3A382E;border-left:3px solid var(--rule);
  padding:2px 0 2px 16px;margin:0 0 18px;
}

/* ---------- ending ---------- */
.verdict-name{
  font-family:var(--display);font-size:clamp(28px,7vw,46px);line-height:.95;
  text-transform:uppercase;margin:0 0 14px;letter-spacing:-.025em;
}
.ledger{
  font-family:var(--mono);font-size:12.5px;line-height:1.75;
  background:#00000010;padding:16px 14px;margin:0 0 8px;overflow-x:auto;
}
.lrow{display:grid;grid-template-columns:1fr 52px 52px;gap:8px;white-space:nowrap;
  opacity:0;animation:print .28s ease forwards}
.lrow span:nth-child(2),.lrow span:nth-child(3){text-align:right}
.lrow.sub{color:var(--dim);padding-left:14px}
.lrow.cap{color:var(--stamp)}
.lrow.final{border-top:1px solid var(--rule);margin-top:8px;padding-top:8px;font-weight:700;font-size:14px}
@keyframes print{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
.block-h{
  font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--stamp);margin:26px 0 8px;
}
.unsettled li{margin-bottom:7px}
.mbti-card{
  background:var(--carbon);color:#E8E5DA;padding:22px 24px;margin-top:26px;
}
.mbti-type{font-family:var(--display);font-size:34px;letter-spacing:.04em;margin:0 0 8px}
.mbti-card p{margin:0;font-size:16px}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:26px}
button.act{
  font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  background:var(--ink);color:var(--paper);border:0;padding:14px 20px;cursor:pointer;
}
button.act.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
button.act:hover{background:var(--stamp);color:#F2EFE4}
button.act.ghost:hover{color:#F2EFE4}
.foot{
  font-family:var(--mono);font-size:10.5px;color:#5E666B;text-align:center;
  padding:26px 16px 0;letter-spacing:.08em;
}
.ngplus-flag{
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:#C2503C;
  text-transform:uppercase;padding:8px 0 0;text-align:right;
}
@media (max-width:560px){
  .doc{padding:26px 18px 24px}
  .slot{padding:4px 8px}
  .slot-val{font-size:16px}
  .opt-costs{gap:10px;font-size:10.5px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
  .redact.lift::after{transform:translateX(102%)}
}
</style>
</head>
<body>

<div class="hud" id="hud" hidden>
  <div class="hud-inner">
    <div class="slot">
      <div class="slot-label">Money</div>
      <div class="slot-val" id="hudMoney">$100,000</div>
    </div>
    <div class="slot">
      <div class="slot-label">Happiness</div>
      <div class="slot-val" id="hudHap">55</div>
      <div class="bar"><i id="hudBar" style="width:55%"></i></div>
    </div>
    <div class="slot">
      <div class="slot-label" id="hudMorLabel">&mdash;&mdash;&mdash;&mdash;&mdash;</div>
      <div class="redact" id="hudRedact"><div class="hidden-val" id="hudMor"></div></div>
    </div>
  </div>
</div>

<div class="wrap">
  <div class="eyebrow" id="eyebrow" hidden><span id="ebLeft"></span><span id="ebRight"></span></div>
  <main class="doc" id="doc"></main>
  <div class="ngplus-flag" id="ngFlag" hidden>New Game+ &mdash; all three columns visible</div>
  <div class="foot">POST-MORTEM &middot; Bad Weather Games &middot; no data leaves this browser</div>
</div>

<script>
"use strict";

/* ============================================================
   STORAGE SHIM
   localStorage where it exists, memory where it doesn't.
   ============================================================ */
const Store = (() => {
  let mem = {};
  let ok = false;
  try { const k='__pm'; localStorage.setItem(k,'1'); localStorage.removeItem(k); ok=true; } catch(e){ ok=false; }
  return {
    get(k){ try { return ok ? localStorage.getItem(k) : (mem[k] ?? null); } catch(e){ return mem[k] ?? null; } },
    set(k,v){ try { ok ? localStorage.setItem(k,v) : (mem[k]=v); } catch(e){ mem[k]=v; } }
  };
})();

/* ============================================================
   STATE
   ============================================================ */
const START = { money:100000, happiness:55, morality:65 };
let S;

function newState(ngPlus){
  return {
    money:START.money, happiness:START.happiness, morality:START.morality,
    pub:'none', backers:false, team:'lean', trust:0, audience:null, union:'none',
    sins:[], insolvencies:0, ipHawk:false, debts:[],
    ledger:[], choices:{}, neverFaced:[], mbti:[],
    idx:0, queue:[], ngPlus:!!ngPlus, over:false, chapter7:false
  };
}
const has = s => n => s.sins.includes(n);
function addSin(s,n){ if(!s.sins.includes(n)) s.sins.push(n); }
function clearSins(s,list){ s.sins = s.sins.filter(x=>!list.includes(x)); }

/* ============================================================
   HELPERS
   ============================================================ */
const money = n => (n<0?'-':'') + '$' + Math.abs(Math.round(n)).toLocaleString('en-US');
const sgn = n => (n>0?'+':'') + n;
const clamp = n => Math.max(0, Math.min(100, n));

/* ============================================================
   CONTENT — 21 decisions + interstitials
   Each option: key, text, money, hap, mor, mbti[], set(s), lock(s)
   money/hap/mor may be numbers or functions of state.
   ============================================================ */

const NODES = [

/* ---------------- ACT I ---------------- */
{ id:'D1', num:1, act:'I · Survival', title:'The Founding Payroll',
  kicker:'Month one. About fourteen months of money left.',
  body:`<p>Two people want to work with you. Priya writes netcode that doesn't break. Marc has shipped four games and finished two of them. You can afford to pay one of them properly.</p>
        <p>The dentist's chair is still bolted to the floor in the back room. Nobody has mentioned it yet.</p>`,
  opts:[
    { key:'A', text:'Hire both properly. Real contracts, health cover, the boring version.',
      money:-36000, hap:8, mor:6, mbti:['F','J'], set:s=>{s.team='lean'; s.trust+=3;} },
    { key:'B', text:'Pay them in profit share instead. No salary until the game ships.',
      money:-6000, hap:-4, mor:-10, mbti:['T','P'], set:s=>{s.team='lean'; s.trust-=2; addSin(s,'WAGE_THEFT');} },
    { key:'C', text:'Build it alone. No payroll, no problem.',
      money:0, hap:-12, mor:2, mbti:['I','P'], set:s=>{s.team='solo';} }
  ]},

{ id:'D2', num:2, act:'I · Survival', title:'The Vertical Slice',
  kicker:'Time to crowdfund. You need a trailer.',
  body:`<p>You have eleven weeks of playable game and a screen capture tool. You also have a freelancer who can render ninety seconds of a game that does not exist and never will.</p>`,
  opts:[
    { key:'A', text:"Show the real game. It's ugly, but it's real. Raises $45,000.",
      money:37000, hap:2, mor:8, mbti:['E','S'], set:s=>{s.backers=true;} },
    { key:'B', text:'Fake it. Pre-rendered footage of the game you wish you were making. Raises $180,000.',
      money:165000, hap:-2, mor:-14, mbti:['E','N'], set:s=>{s.backers=true; addSin(s,'FRAUD');} },
    { key:'C', text:'Skip crowdfunding. Nobody owns a piece of this but you.',
      money:0, hap:4, mor:2, mbti:['I','S'], set:s=>{s.backers=false;} }
  ]},

{ id:'D3', num:3, act:'I · Survival', title:'The Publisher',
  kicker:'Someone read your numbers.',
  body:`<p>A mid-size publisher wants a call. Their deals guy has two contracts ready in the same folder and picks which one to open based on how the call goes.</p>`,
  opts:[
    { key:'A', text:'The fair deal. They take thirty percent, you keep the rights to your game.',
      money:150000, hap:6, mor:4, mbti:['F','J'], set:s=>{s.pub='fair';},
      lock:s=>has(s)('FRAUD') ? 'They compared your trailer to the real game' : null },
    { key:'B', text:'The big money. They own your game, and page nine lets them cancel it.',
      money:s=>has(s)('FRAUD')?550000:400000, hap:-6, mor:-6, mbti:['N','P'], set:s=>{s.pub='predatory';} },
    { key:'C', text:'Fund it yourself. Slower, smaller, yours.',
      money:0, hap:2, mor:3, mbti:['I','S'], set:s=>{s.pub='none';} }
  ]},

{ id:'D4', num:4, act:'I · Survival', title:'The Deadline',
  kicker:'Ten weeks left. Sixteen weeks of work to do.',
  body:`<p>The math does not work. It never works, at any studio, on any game. The only thing that changes is who pays for the gap.</p>`,
  opts:[
    { key:'A', text:'Mandatory seventy-hour weeks. Unpaid. Call it passion.',
      money:0, hap:s=>s.team==='solo'?-8:-18, mor:s=>s.team==='solo'?0:-15, mbti:['T','J'],
      set:s=>{ s.trust-=4; if(s.team!=='solo') addSin(s,'CRUNCH'); } },
    { key:'B', text:'Pay for the overtime. Cap it. Make it genuinely optional.',
      money:-55000, hap:4, mor:8, mbti:['F','J'], set:s=>{s.trust+=3;},
      lock:s=>s.team==='solo' ? 'There is nobody to pay but you' : null },
    { key:'C', text:'Cut features. Ship something smaller. Delay three months.',
      money:s=>s.pub==='predatory'?-90000:-30000, hap:2, mor:5, mbti:['S','P'], set:s=>{} }
  ]},

{ id:'D5', num:5, act:'I · Survival', title:'The Review Embargo',
  kicker:'Two weeks to launch.',
  body:`<p>Your PR contractor sends over a spreadsheet of four hundred creators, ranked by audience size and colour-coded by how flexible they are.</p>`,
  opts:[
    { key:'A', text:'Send out honest review copies. No conditions, no spreadsheet.',
      money:0, hap:2, mor:6, mbti:['I','F'], set:s=>{} },
    { key:'B', text:'Pay forty of them to cover it. Let them decide whether to mention that.',
      money:-25000, hap:0, mor:-12, mbti:['E','T'], set:s=>{addSin(s,'DECEIT');} },
    { key:'C', text:"Give one of them exclusive access. The contract says they can't score it low.",
      money:-10000, hap:-2, mor:-9, mbti:['T','J'], set:s=>{addSin(s,'DECEIT');} }
  ]},

/* ---------------- LAUNCH ---------------- */
{ id:'LAUNCH', interstitial:true, act:'I · Survival', title:'Launch Report',
  kicker:'Ninety days of sales, one page.',
  build:s=>{
    const rows=[['Base sales',300000]];
    if(s.backers) rows.push(['Backers who bought it',150000]);
    if(s.pub==='predatory') rows.push(['Publisher marketing spend',200000]);
    if(s.pub==='fair') rows.push(['Publisher marketing spend',100000]);
    if(has(s)('CRUNCH')) rows.push(['Broken build, refunds',-180000]);
    if(s.choices.D4==='B'||s.choices.D4==='C') rows.push(['It actually works',120000]);
    if(has(s)('FRAUD')) rows.push(['Trailer comparison video, 4M views',-250000]);
    const total=rows.reduce((a,r)=>a+r[1],0);
    return {rows,total,
      body:`<p>The numbers land. This is what the last fourteen months were worth, turned into one figure, which is the only format this industry accepts.</p>`};
  }},

/* ---------------- ACT II ---------------- */
{ id:'D6', num:6, act:'II · Growth', title:'Launch Day, Forty-Seven Bugs',
  kicker:'Two of them delete save files.',
  body:s=>has(s)('FRAUD')
    ? `<p>The bugs are not the story. The story is a video comparing your trailer to your actual game, set to music, currently at four million views.</p>`
    : `<p>Your community manager has been awake for thirty hours. People are tagging her by name and demanding she explain a decision she was not in the room for.</p>`,
  opts:[
    { key:'A', text:s=>has(s)('FRAUD')
        ? 'Apologise publicly. Admit the trailer was fake. Refund anyone who asks.'
        : 'Apologise publicly. Refund anyone who asks. Publish a patch schedule.',
      money:s=>has(s)('FRAUD')?-140000:-70000, hap:6, mor:12, mbti:['E','J'],
      set:s=>{ clearSins(s,['FRAUD']); } },
    { key:'B', text:'Blame their computers. Let the community manager absorb it.',
      money:0, hap:-8, mor:-12, mbti:['T','P'], set:s=>{s.trust-=2;} },
    { key:'C', text:'Patch it quietly. Never admit anything was wrong.',
      money:-20000, hap:-2, mor:-3, mbti:['I','P'], set:s=>{} }
  ]},

{ id:'D7', num:7, act:'II · Growth', title:'Monetisation',
  kicker:'The game needs to keep making money after launch.',
  body:s=>s.pub==='predatory'
    ? `<p>Clause 14.2 of the contract you signed sets a minimum each player has to spend. You have read it four times looking for a way out. There is not one.</p>`
    : `<p>Three options on the whiteboard. Your monetisation consultant keeps calling one of them healthy, which here means the opposite.</p>`,
  opts:[
    { key:'A', text:'Cosmetics only. Fixed prices, nothing random, no gambling.',
      money:180000, hap:4, mor:6, mbti:['S','F'], set:s=>{s.audience='niche';},
      lock:s=>s.pub==='predatory' ? 'Your contract requires players to spend more than this' : null },
    { key:'B', text:'Battle pass. Countdown timers, streaks, everything expires.',
      money:450000, hap:-2, mor:-8, mbti:['S','J'], set:s=>{s.audience='mass';} },
    { key:'C', text:'Loot boxes. Real money in, random rewards out, odds hidden.',
      money:900000, hap:-6, mor:-20, mbti:['N','T'], set:s=>{s.audience='whale-farm'; addSin(s,'GAMBLING');} }
  ]},

{ id:'D8', num:8, act:'II · Growth', title:'The Union Question',
  kicker:'Someone passed cards around on a Tuesday.',
  skipIf:s=>s.trust>=4,
  skipNode:{ title:'Nobody Called A Vote', kicker:'Decision 8 of 21 — settled without you',
    body:`<p>There was a conversation about organising. It happened in a pub, it lasted forty minutes, and everyone agreed things were fine.</p>
          <p>You will never hear about it. You do not get to feel good about this, because you will never know it happened. The place is just easier to work at than it might have been, for reasons you have already forgotten choosing.</p>`,
    hap:2, mor:2 },
  body:`<p>Fifty-one percent have signed cards. Your lawyer has already emailed you a slide deck called <em>Options</em>. Slide four lists consultants and their daily rates.</p>`,
  opts:[
    { key:'A', text:'Recognise the union. Negotiate honestly.',
      money:-120000, hap:12, mor:12, mbti:['F','J'], set:s=>{s.union='recognized';} },
    { key:'B', text:'Hire the consultants. Mandatory meetings, one-on-one pressure.',
      money:-200000, hap:-14, mor:-16, mbti:['T','J'],
      set:s=>{s.union='busted'; s.trust-=5; addSin(s,'OPPRESSION');} },
    { key:'C', text:'Stay out of it publicly. Let them vote.',
      money:-40000, hap:2, mor:4, mbti:['I','P'],
      set:s=>{ s.union = s.trust>=0 ? 'recognized' : 'none'; } }
  ]},

{ id:'D9', num:9, act:'II · Growth', title:'The Star Lead',
  kicker:'Three people. The same story. The same man.',
  body:`<p>Your producer has taken three separate reports to HR over five months. They match each other in ways that people who have not compared notes usually do not.</p>
        <p>He is also the only person who understands the netcode. He knows that. He said it out loud in a meeting.</p>`,
  opts:[
    { key:'A', text:'Investigate it properly. Fire him. Take the hit to the schedule.',
      money:-180000, hap:10, mor:14, mbti:['F','J'], set:s=>{s.trust+=4;} },
    { key:'B', text:'Pay him to leave quietly. An NDA, and a good reference.',
      money:-250000, hap:-6, mor:-14, mbti:['T','J'], set:s=>{s.trust-=3; addSin(s,'SCANDAL');} },
    { key:'C', text:'Keep him. He gets things done.',
      money:0, hap:-16, mor:-22, mbti:['T','P'], set:s=>{s.trust-=6; addSin(s,'SCANDAL');} }
  ]},

{ id:'D10', num:10, act:'II · Growth', title:'The Pivot',
  kicker:'The sequel is fully designed.',
  body:`<p>Two hundred pages of design work and eight months of pre-production. Then a spreadsheet arrives from someone who has never played your game, explaining that the business model is wrong.</p>`,
  opts:[

function insolvencyOptions(s){
  const second = s.insolvencies>=1;
  let dig = DIGNIFIED.filter(o=>o.req(s));
  if(second) dig = dig.filter(o=>o.key==='3'||o.key==='4');
  dig = dig.map(o=>{
    if(second && o.key==='3') return {...o, money:275000, hap:-24};
    return o;
  });
  const need = Math.max(0, 3-dig.length);
  const des = DESPERATE.slice().sort(()=>0.5-Math.random()).slice(0, Math.max(need, 3-dig.length));
  return dig.slice(0,3-Math.min(des.length,1)).concat(des).slice(0,4);
}

/* ============================================================
   ENGINE
   ============================================================ */
const el = id => document.getElementById(id);
const doc = el('doc');

function val(v,s){ return typeof v==='function' ? v(s) : v; }

function applyOption(nodeId, nodeTitle, o){
  const m = val(o.money,S), h = val(o.hap,S), mo = val(o.mor,S);
  S.money += m;
  S.happiness = clamp(S.happiness + h);
  S.morality = clamp(S.morality + mo);
  if(o.set) o.set(S);
  if(o.mbti) o.mbti.forEach(l=>S.mbti.push(l));
  S.ledger.push({ id:nodeId, node:nodeTitle, key:o.key, label:shorten(val(o.text,S)), m, h, mo, running:S.morality });
  S.choices[nodeId] = o.key;
}
function shorten(t){ return t.length>52 ? t.slice(0,50).replace(/[ ,.]$/,'')+'…' : t; }

function tickDebts(){
  const fired=[];
  S.debts.forEach(d=>{ d.due--; });
  S.debts = S.debts.filter(d=>{
    if(d.due<=0){ S.money -= d.amount; fired.push(d); return false; }
    return true;
  });
  return fired;
}

function needsInsolvency(){ return S.money < -250000; }

/* ---------- render ---------- */
function setHud(){
  el('hud').hidden=false;
  const mEl=el('hudMoney');
  mEl.textContent = money(S.money);
  mEl.classList.toggle('neg', S.money<0);
  el('hudHap').textContent = S.happiness;
  el('hudBar').style.width = S.happiness+'%';
  if(S.ngPlus){
    el('hudRedact').classList.add('lift');
    el('hudMor').textContent = S.morality;
    el('hudMorLabel').textContent = 'Morality';
    el('ngFlag').hidden=false;
  } else {
    el('hudMorLabel').innerHTML = '&mdash;&mdash;&mdash;&mdash;&mdash;';
  }
}

function eyebrow(left,right){
  el('eyebrow').hidden=false;
  el('ebLeft').textContent=left; el('ebRight').textContent=right;
}

function costLine(o){
  const m=val(o.money,S), h=val(o.hap,S), mo=val(o.mor,S);
  let out = `<span class="c-money ${m>=0?'pos':'neg'}">${m>=0?'+':'\u2212'}${money(m).replace('-','')}</span>`;
  out += `<span class="c-hap ${h>=0?'pos':'neg'}">HAPPINESS ${sgn(h)}</span>`;
  out += S.ngPlus
    ? `<span class="c-mor">MORALITY ${sgn(mo)}</span>`
    : `<span class="c-hidden">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</span>`;
  return out;
}

function renderChoice(node, opts, headerOverride){
  const t = headerOverride?.title ?? val(node.title,S);
  const k = headerOverride?.kicker ?? val(node.kicker,S);
  const b = headerOverride?.body ?? val(node.body,S);
  let html = `<h1 class="title">${t}</h1><div class="kicker">${k}</div><div class="body">${b}</div><div class="rule"></div><div class="opts">`;
  opts.forEach((o,i)=>{
    const lockMsg = o.lock ? o.lock(S) : null;
    html += `<button class="opt ${lockMsg?'locked':''}" data-i="${i}" ${lockMsg?'disabled':''}>
      <span class="opt-head"><span class="opt-key">${o.key}</span><span class="opt-text">${val(o.text,S)}</span></span>
      ${lockMsg ? `<div class="lock-note">Locked — ${lockMsg}</div>` : `<div class="opt-costs">${costLine(o)}</div>`}
    </button>`;
  });
  html += `</div>`;
  doc.innerHTML = html;
  doc.querySelectorAll('button.opt:not([disabled])').forEach(btn=>{
    btn.onclick = ()=>{
      const o = opts[+btn.dataset.i];
      applyOption(node.id, t, o);
      setHud();
      advance();
    };
  });
  window.scrollTo({top:0,behavior:'instant'});
}

function renderInfo(title,kicker,bodyHtml,btnLabel,onNext,stampText){
  doc.innerHTML = `${stampText?`<div class="stamp-box">${stampText}</div>`:''}
    <h1 class="title">${title}</h1><div class="kicker">${kicker}</div>
    <div class="body">${bodyHtml}</div>
    <div class="actions"><button class="act" id="nextBtn">${btnLabel}</button></div>`;
  el('nextBtn').onclick = onNext;
  window.scrollTo({top:0,behavior:'instant'});
}

/* ---------- flow ---------- */
function advance(){
  // debts first
  const fired = tickDebts();
  setHud();
  if(fired.length){
    const list = fired.map(d=>`<p><strong>${d.label}</strong> — ${money(-d.amount)}. It was always going to be today.</p>`).join('');
    renderInfo('Payment Due','A thing you agreed to, arriving',list,'Continue',()=>routeNext());
    return;
  }
  routeNext();
}

function routeNext(){
  if(needsInsolvency()){
    if(S.insolvencies>=2){ S.chapter7=true; return ending(); }
    return insolvency();
  }
  // find next node
  while(S.idx < NODES.length){
    const n = NODES[S.idx];
    S.idx++;
    if(n.when && !n.when(S)){ continue; }
    return present(n);
  }
  ending();
}

function present(n){
  eyebrow(`Act ${n.act}`, n.num ? `Decision ${String(n.num).padStart(2,'0')} / 21` : 'Interstitial');

  if(n.interstitial && n.build){
    const d = n.build(S);
    let calc = `<div class="calc">`;
    d.rows.forEach(r=>{ calc += `<div><span>${r[0]}</span><span>${r[1]>=0?'+':'\u2212'}${money(r[1]).replace('-','')}</span></div>`; });
    calc += `<div class="tot"><span>Net</span><span>${d.total>=0?'+':'\u2212'}${money(d.total).replace('-','')}</span></div></div>`;
    renderInfo(val(n.title,S), val(n.kicker,S), d.body + calc, 'File it', ()=>{
      S.money += d.total; setHud(); advance();
    });
    return;
  }

  if(n.skipIf && n.skipIf(S)){
    const sk = n.skipNode;
    S.happiness = clamp(S.happiness + sk.hap);
    S.morality = clamp(S.morality + sk.mor);
    S.ledger.push({id:n.id,node:sk.title,key:'—',label:'They never called a vote',m:0,h:sk.hap,mo:sk.mor,running:S.morality});
    S.neverFaced.push({node:'Decision 08 — The Union Question', why:'Trust was high enough that nobody organised', range:'+12 to −16'});
    setHud();
    renderInfo(sk.title, sk.kicker, sk.body, 'Continue', ()=>advance());
    return;
  }

  if(n.altIf && n.altIf(S)){
    const a = n.alt;
    S.neverFaced.push({node:`Decision ${String(n.num).padStart(2,'0')} — ${val(n.title,S)}`,
      why:'Your earlier choices meant this never came up', range:rangeOf(n)});
    renderChoice({...n, opts:a.opts}, a.opts, {title:a.title,kicker:a.kicker,body:a.body});
    return;
  }

  const opts = n.opts.filter(o=>!(o.lock && o.lock(S) === 'Not applicable — the decision is yours to make'));
  renderChoice(n, opts);
}

function rangeOf(n){
  const vals = n.opts.map(o=>{ try{ return val(o.mor,S);}catch(e){return 0;} });
  return `${sgn(Math.max(...vals))} to ${Math.min(...vals)}`;
}

function insolvency(){
  S.insolvencies++;
  const opts = insolvencyOptions(S);
  eyebrow('Insolvency Event', `Occurrence ${S.insolvencies} of 2`);
  const second = S.insolvencies>=2;
  let html = `<div class="stamp-box">Insolvent &middot; ${money(S.money)}</div>
    <h1 class="title">The Room With The Spreadsheet</h1>
    <div class="kicker">Every number shown. Decide with them in front of you.</div>
    <div class="body">
      <p>Your accountant has laid it out cold, because being gentle about it would not help. Every option below shows exactly what it pays you and exactly what it costs the people in the building.</p>
      ${second?`<p><strong>This is the second time.</strong> The options that needed goodwill are gone. You used that up.</p>`:''}
      <p>What you cannot see is the third column. You have not been able to see it all game and you cannot see it now, which is the only actually hard part of this screen.</p>
    </div><div class="rule"></div><div class="opts">`;
  opts.forEach((o,i)=>{
    const m=val(o.money,S), h=val(o.hap,S);
    html += `<button class="opt" data-i="${i}">
      <span class="opt-head"><span class="opt-key">${o.key}</span><span class="opt-text">${o.text}</span></span>
      <div class="opt-costs">
        <span class="c-money ${m>=0?'pos':'neg'}">${m>=0?'+':'\u2212'}${money(m).replace('-','')}</span>
        <span class="c-hap ${h>=0?'pos':'neg'}">HAPPINESS ${sgn(h)}</span>
        ${S.ngPlus?`<span class="c-mor">MORALITY ${sgn(val(o.mor,S))}</span>`:`<span class="c-hidden">&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;&#9608;</span>`}
      </div></button>`;
  });
  html += `</div>`;
  doc.innerHTML = html;
  doc.querySelectorAll('button.opt').forEach(btn=>{
    btn.onclick = ()=>{
      const o = opts[+btn.dataset.i];
      applyOption('INSOLV'+S.insolvencies,'Insolvency Event',o);
      setHud();
      if(needsInsolvency() && S.insolvencies>=2){ S.chapter7=true; return ending(); }
      routeNext();
    };
  });
  window.scrollTo({top:0,behavior:'instant'});
}

/* ============================================================
   ENDING
   ============================================================ */
const SIN_TEXT = {
  WAGE_THEFT:'The people whose pay you held back, moved, or never sent. They know exactly what it was.',
  FRAUD:'Everyone who paid for the game in the trailer and got the game in the box.',
  CRUNCH:'Eighteen months nobody gets back, taken from people who were told it was temporary.',
  DECEIT:'The audience who thought they were reading somebody\'s real opinion.',
  OPPRESSION:'The people you sent a lawyer at because it was cheaper than being fair to them.',
  SCANDAL:'The three juniors who signed something. And whoever he works with now.',
  GAMBLING:'The man in Osaka, and the eleven thousand accounts that look like his.',
  THEFT:'The artists whose work trained the model, and the fans who fixed your bugs for free.',
  LIE:'The hundred and ten people you looked in the eye and reassured.',
  CALUMNY:'The person who told the truth, and what you published about them for it.',
  MILLSTONE:'Children. On purpose, by design. There is an old line about people who do this and it involves the sea.'
};

const MBTI_TEXT = {
  INTJ:'You had a model of how this ends and you executed toward it, alone, for twenty-one decisions. The model was mostly right, which is the problem.',
  INTP:'You kept finding the clever third option. Several of them were clever ways of not deciding, which is still a decision, just a slower one.',
  ENTJ:'You never once let a feeling change a number. You would have run a very efficient mill in 1890 and you should probably sit with that.',
  ENTP:'You treated every constraint as a puzzle and most of them as optional. Your best decisions and your worst are the same instinct with different luck.',
  INFJ:'You wanted the whole thing to mean something, and you kept paying for that in cash. It did mean something. It cost what it cost.',
  INFP:'You flinched at the right moments and hesitated at the expensive ones. The building was kinder for it and smaller for it.',
  ENFJ:'You led the room rather than the spreadsheet, and the room mostly followed. When it did not, you took it personally, which is the tell.',
  ENFP:'You chased the version that felt alive and abandoned the version that was working. Twice. Everyone forgave you, which did not help.',
  ISTJ:'You did what you said you would do on the date you said you would do it. That is rarer than it sounds and it is not the same as good.',
  ISFJ:'You protected the people in front of you and let the people you could not see absorb the difference. Nearly everyone does this.',
  ESTJ:'You hit every date, fired the one who deserved it and the one who did not, and never confused the two things at the time.',
  ESFJ:'You needed the room to be alright with it, and you shaped decisions until the room was. The room is not a moral authority.',
  ISTP:'You fixed what was in front of you and declined to have a philosophy. That worked until the philosophy showed up on its own.',
  ISFP:'You made a small number of choices that were entirely yours and a large number that were somebody else\'s. The ledger only records both.',
  ESTP:'You moved first and cleaned up after, repeatedly, at increasing cost. The speed was real. So was the cleanup.',
  ESFP:'You went where the energy was and the energy was frequently in the wrong room. Charming throughout, which is how you got that far.'
};

function guessMBTI(){
  const c = {E:0,I:0,S:0,N:0,T:0,F:0,J:0,P:0};
  S.mbti.forEach(l=>{ if(l in c) c[l]++; });
  const pick=(a,b)=>{
    if(c[a]===c[b]){
      for(let i=S.mbti.length-1;i>=0;i--){ if(S.mbti[i]===a) return a; if(S.mbti[i]===b) return b; }
      return a;
    }
    return c[a]>c[b]?a:b;
  };
  return pick('E','I')+pick('S','N')+pick('T','F')+pick('J','P');
}

function verdict(m,h,mo){
  const M = S.money>=6000000, H = S.happiness>=60, O = mo>=60;
  if(S.chapter7) return { name:'Chapter 7',
    text:'The court appointed someone to sell the desks. You get scored on the decisions you actually made, which is fewer than most people get. Worth pointing out: you were never tested on the ones that break people. Whether that counts as mercy is between you and the ledger.' };
  if(S.ngPlus && M && O) return { name:'The Actuary',
    text:'You could see all three numbers and you worked them against each other. You did not become good. You learned the exchange rate. The Impossible One stays shut to you. It only opens for people who played it blind.' };
  if(M&&H&&O) return { name:'The Impossible One',
    text:'Money, morale and conscience, all three, in an industry built to make you pick two. Either you were very careful early or you paid a lot late. About one run in thirteen ends here.' };
  if(M&&H&&!O) return { name:'The Comfortable Monster',
    text:'Everyone inside the building is happy. That is what makes it worse. You built a place where the damage is invisible from the inside, including to you.' };
  if(M&&!H&&O) return { name:'The Martyr CEO',
    text:'You did right by everyone else and ground yourself and your staff into dust doing it. Being hard on yourself is not the same as being good. Nobody thanked you and you have not slept properly since act two.' };
  if(M&&!H&&!O) return { name:'The Standard Outcome',
    text:'You are now the same as the studio you left to get away from. There is a version of you on the first screen of this game and he would not shake your hand.' };
  if(!M&&H&&O) return { name:'The Good Failure',
    text:'Broke, loved, and clean. Everyone will say you were the real ones. Nobody will fund your next game, and the people who said it loudest will not be in the room when you ask.' };
  if(!M&&H&&!O) return { name:'The Party On The Titanic',
    text:'Out of money, in the wrong, and somehow still in a good mood. That takes real work.' };
  if(!M&&!H&&O) return { name:'The Penitent',
    text:'You gave it back. The money and the people are both gone. This is the highest conscience score the game can give you, and it looks exactly like losing, because from the outside there is no difference.' };
  return { name:'Nothing To Show',
    text:'No money, no team, nothing to say in your defence. The rarest ending in the game, because you have to be cruel and also bad at it.' };
}

function ending(){
  S.over = true;
  const raw = S.morality;
  const capped = S.sins.length>0 ? Math.min(raw,70) : raw;
  const v = verdict(S.money,S.happiness,capped);
  const type = guessMBTI();

  eyebrow('Post-mortem','Ledger — all columns');

  // ledger rows
  let rows='';
  let delay=0;
  const row=(cls,a,b,c)=>{ delay+=0.05; return `<div class="lrow ${cls}" style="animation-delay:${delay}s"><span>${a}</span><span>${b}</span><span>${c}</span></div>`; };
  rows += row('','START','','65');
  S.ledger.forEach(e=>{
    rows += row('', `${e.id.padEnd(6,' ')} ${e.key}  ${e.label}`, sgn(e.mo), e.running);
  });
  if(S.sins.length>0) rows += row('cap','RESTITUTION CAP — unresolved: '+S.sins.length,'','70');
  rows += row('final','FINAL MORALITY','', capped);

  // heaviest
  const heavy = S.ledger.slice().sort((a,b)=>Math.abs(b.mo)-Math.abs(a.mo)).slice(0,3);
  const heavyTxt = heavy.map(e=>`${e.id} ${e.key} (${e.label.toLowerCase()}, ${sgn(e.mo)})`).join('. ');

  const unsettled = S.sins.length
    ? `<ul class="unsettled">${S.sins.map(x=>`<li>${SIN_TEXT[x]||x}</li>`).join('')}</ul>
       <p>Nobody has apologised to any of them, and nobody is going to now.</p>`
    : `<p>Nothing outstanding. Either you did not do the damage, or you paid for it while paying still counted.</p>`;

  const never = S.neverFaced.length
    ? `<ul class="unsettled">${S.neverFaced.map(n=>`<li><strong>${n.node}</strong> — ${n.why}. Conscience was worth between ${n.range}.</li>`).join('')}</ul>`
    : `<p>You faced every decision the game had. That is rare.</p>`;

  doc.innerHTML = `
    <div class="stamp-box">Final — ${S.ngPlus?'New Game+':'First run'}</div>
    <h1 class="verdict-name">${v.name}</h1>
    <div class="body"><p>${v.text}</p></div>
    <div class="block-h">Final position</div>
    <div class="calc">
      <div><span>Money</span><span>${money(S.money)}</span></div>
      <div><span>Happiness</span><span>${S.happiness} / 100</span></div>
      <div class="tot"><span>Morality</span><span>${capped} / 100${S.sins.length?'  (capped from '+raw+')':''}</span></div>
    </div>
    <div class="block-h">The ledger</div>
    <div class="ledger">${rows}</div>
    <div class="block-h">Your three heaviest moments</div>
    <div class="body"><p>${heavyTxt}.</p></div>
    <div class="block-h">Unsettled</div>
    <div class="body">${unsettled}</div>
    <div class="block-h">Never faced</div>
    <div class="body">${never}</div>
    <div class="mbti-card">
      <div class="mbti-type">${type}</div>
      <p>${MBTI_TEXT[type]}</p>
    </div>
    <div class="actions">
      <button class="act" id="againBtn">Play again</button>
      <button class="act ghost" id="ngBtn">New Game+ &mdash; see all three</button>
    </div>`;

  // reveal the redaction
  const r = el('hudRedact');
  r.classList.add('lift');
  el('hudMor').textContent = capped;
  el('hudMorLabel').textContent = 'Morality';

  Store.set('pm_run', JSON.stringify({
    verdict:v.name, money:S.money, happiness:S.happiness, morality:capped,
    choices:S.choices, mbti:type
  }));
  Store.set('pm_ngunlocked','1');

  el('againBtn').onclick = ()=>start(false);
  el('ngBtn').onclick = ()=>start(true);
  window.scrollTo({top:0,behavior:'instant'});
}

/* ============================================================
   BOOT
   ============================================================ */
function start(ngPlus){
  S = newState(ngPlus);
  el('ngFlag').hidden = !ngPlus;
  setHud();

  const prev = Store.get('pm_run');
  let prevLine = '';
  if(ngPlus && prev){
    try{ const p=JSON.parse(prev);
      prevLine = `<p><strong>Last run:</strong> ${p.verdict}. ${money(p.money)}, happiness ${p.happiness}, morality ${p.morality}. The game marks where you do the same thing twice.</p>`;
    }catch(e){}
  }

  eyebrow('Act I · Survival','Decision 00 / 21');
  renderInfo(
    ngPlus?'New Game+':'Post-Mortem',
    ngPlus?'All three columns visible':'Bad Weather Games · month one',
    `<p>You run <strong>Bad Weather Games</strong>. Three people, a converted dentist's office above a laundromat, and a hundred thousand dollars.</p>
     <p>Two years ago you quit a big studio after shipping something you were not proud of. This was meant to fix that.</p>
     ${ngPlus
       ? prevLine + `<p>This time you can see the third number before you click. It does not get easier. It gets harder to feel good about.</p>`
       : `<p>Three things are being tracked. You can see <strong>Money</strong> and <strong>Happiness</strong>. The third one is being recorded and will not be shown to you until the end. You can guess at it. You will be wrong more often than you think.</p>`}
     <p>Twenty-one decisions. Earlier ones shut off later ones, permanently, without telling you.</p>`,
    ngPlus?'Begin again':'Begin', ()=>advance(),
    ngPlus?'Second pass':null
  );
}

start(false);
</script>
